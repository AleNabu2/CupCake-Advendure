<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CupCake Adventure</title>
    <script src="game.js" defer></script>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="side-panel">
        <h2>Instrucciones</h2>
        <p id="record" style="font-weight: bold; margin-bottom: 20px;">
            Récord: 0
        </p>

        <div class="info-item">
            <img src="assets/Pink_Monster.png">
            <p><b>Pablo:</b> Tu </p>
        </div>

        <div class="info-item">
            <img src="assets/cupcake.png">
            <p><b>Cupcake:</b> Recógelos para alimentar a Hoop.</p>
        </div>

        <div class="info-item">
            <img src="assets/star.png">
            <p><b>Star:</b> Aumenta la puntuación máxima.</p>
        </div>

        <div class="info-item">
            <img src="assets/Owlet_Monster.png">
            <p><b>Hoop:</b> Hoops alimentados.</p>
        </div>

        <div class="info-item">
            <img src="assets/Flamestatic.png">
            <p><b>Flame:</b> Si te da un latigazo, te mata.</p>
        </div>

        <div class="info-item">
            <img src="assets/Dude_Monster.png">
            <p><b>Glotón:</b> Te roba los cupcakes de Hoop.</p>
        </div>
    </div>

</body>

</html>
